[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predmaint"
version = "1.0.0"
description = "Predictive maintenance MLOps pipeline: validation, tracking, tuning, drift monitoring and explainability"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kritikesh" }]

[project.scripts]
predmaint = "predmaint.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
