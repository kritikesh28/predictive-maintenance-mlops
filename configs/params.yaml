# Reference copy of the run configuration (source of truth: src/predmaint/config.py)
seed: 42
split:
  validation_size: 0.2
  stratified: true
imbalance:
  method: SMOTE
  k_neighbors: 3          # rarest class (TWF) has only 24 training samples
  applied_to: train_split_only
candidates: [LogisticRegression, RandomForest, XGBoost, LightGBM]
selection_metric: macro_f1
tuning:
  library: optuna
  sampler: TPE(seed=42)
  n_trials: 30
  search_space:
    n_estimators: [100, 500]
    max_depth: [3, 10]
    learning_rate: [0.01, 0.3, log]
    min_child_weight: [1.0, 10.0]
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]
    gamma: [0.0, 2.0]
    reg_alpha: [1.0e-8, 1.0, log]
    reg_lambda: [1.0e-8, 5.0, log]
registry:
  model_name: PredMaint_XGBoost
  alias: production
monitoring:
  tool: evidently
  stattest: wasserstein
  threshold: 0.1
  features: [Air temperature, Process temperature, Rotational speed, Torque, Tool wear]
alerting:
  strain_index_min_Nm: 10000   # tool wear x torque
